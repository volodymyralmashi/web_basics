<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаб№4</title>
</head>

<body>
    <h1>Моя перша HTML-форма</h1>

    <form action="https://httpbin.org/post" method="post">
        <p>
            <label for="user_name">Ім'я:</label>
            <input type="text" id="user_name" name="user_name">
        </p>
        <p>
            <label for="user_birthdate">Дата народження:</label>
            <input type="date" id="user_birthdate" name="user_birthdate">
        </p>
        <p>
            <label>Імейл: <input type="email" name="user_email"></label>
        </p>
        <p>
            <label>Повідомлення: <textarea name="user_message"></textarea></label>
        </p>
        <fieldset>
            <legend>Ваші улюблені напої?</legend>
            <label><input type="checkbox" name="drinks" value="coffee"> Кава</label>
            <label><input type="checkbox" name="drinks" value="tea"> Чай</label>
            <label><input type="checkbox" name="drinks" value="juice"> Сік</label>
            <label><input type="checkbox" name="drinks" value="water"> Вода</label>
        </fieldset>

        <fieldset>
            <legend>Моя національність</legend>
            <label><input type="radio" name="nationality" value="ukrainian"> Українець</label>
            <label><input type="radio" name="nationality" value="hungarian"> Угорець</label>
            <label><input type="radio" name="nationality" value="other"> Інша</label>
        </fieldset>
        <button type="submit">Надіслати</button>
        <button type="reset">Очистити</button>

    </form>
    <picture>
        <source media="(max-width: 467px)" srcset="https://picsum.photos/300/500">
        <img src="https://picsum.photos/1000/400" alt="Демонстраційне зображення">
    </picture>

    <script src="script.js"></script>
</body>

</html>
